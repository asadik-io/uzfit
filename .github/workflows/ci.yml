name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          # Build-time public values only; the app validates its full configuration at runtime.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder

  integration:
    name: Database and end-to-end tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,edge-runtime,logflare,vector

      - name: Configure environment from the local stack
        run: |
          pnpm exec supabase status -o env > supabase.env
          value() { grep "^$1=" supabase.env | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(value PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$(value SECRET_KEY)"
            echo "PAYMENT_PROVIDER=demo"
            echo "PAYMENT_WEBHOOK_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "DEMO_PASSWORD=Ci$(openssl rand -hex 8)9"
            echo "MAILPIT_URL=$(value MAILPIT_URL)"
          } >> "$GITHUB_ENV"
          rm supabase.env

      - name: Database integration tests
        run: pnpm test:db

      - name: Reset database and create demo accounts
        run: |
          pnpm exec supabase db reset
          pnpm setup:demo

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
